[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

# Each deck is its own SPA — fallback to its own index.html
[[redirects]]
from = "/:deck/*"
to = "/:deck/index.html"
status = 200
