<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tantuyu's Slides</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 3rem 1.5rem;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
      }

      header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #4ec5d4 0%, #146b8c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }

      header p {
        color: #888;
        font-size: 1.1rem;
      }

      .decks {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .deck-card {
        display: block;
        text-decoration: none;
        color: inherit;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 1.5rem;
        background: #111;
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.15s;
      }

      .deck-card:hover {
        border-color: #4ec5d4;
        background: #161616;
        transform: translateY(-2px);
      }

      .deck-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
      }

      .deck-card h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #f0f0f0;
      }

      .date {
        font-size: 0.8rem;
        color: #666;
        white-space: nowrap;
      }

      .desc {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        color: #999;
        line-height: 1.5;
      }

      footer {
        text-align: center;
        margin-top: 4rem;
        color: #444;
        font-size: 0.8rem;
      }

      footer a {
        color: #4ec5d4;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>TTY Slides</h1>
        <p>Select a presentation</p>
      </header>
      <div class="decks">
        <!-- DECKS_PLACEHOLDER -->
      </div>
      <footer>
        Powered by <a href="https://sli.dev" target="_blank">Slidev</a>
      </footer>
    </div>
  </body>
</html>
